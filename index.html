<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Measure</title>
<meta name="description" content="Замеры на объекте: фото, рёбра, размеры в дюймах, отчёт PDF.">
<meta name="theme-color" content="#eef0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Measure">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Layout: one column of big touch targets; photos carry the page, chrome stays thin.
   Palette: tape-measure yellow on cool concrete greys; plane colors are vivid hues readable on photos. */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --surface-2: #e3e6ea;
  --ink: #12161b;
  --muted: #5b6573;
  --line: #c9ced5;
  --accent: #ffc20e;
  --accent-ink: #12161b;
  --danger: #c8102e;
  --ok: #0b7a3b;
  --scrim: rgba(10, 13, 17, 0.55);
  --ed-bg: #0b0d10;
  --ed-panel: #15191e;
  --ed-key: #232930;
  --ed-key-2: #2e353e;
  --ed-ink: #f2f4f6;
  --ed-muted: #9aa4b1;
  --font-display: "Avenir Next Condensed", "Arial Narrow", -apple-system, system-ui, sans-serif;
  --font-body: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1215; --surface: #181c21; --surface-2: #232830; --ink: #eef1f4; --muted: #9aa4b1;
    --line: #333a43; --accent: #ffc20e; --accent-ink: #12161b; --danger: #ff5a6e; --ok: #4cd38a; --scrim: rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1215; --surface: #181c21; --surface-2: #232830; --ink: #eef1f4; --muted: #9aa4b1;
  --line: #333a43; --accent: #ffc20e; --accent-ink: #12161b; --danger: #ff5a6e; --ok: #4cd38a; --scrim: rgba(0,0,0,0.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 500 17px/1.35 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { min-height: 100%; }
.page { max-width: 760px; margin: 0 auto; padding-inline: var(--gutter-l) var(--gutter-r); padding-block: 8px 120px; }

/* top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding-block: 10px; background: var(--bg);
}
.top .spacer { flex: 1; }
.top h1 { flex: 1; min-width: 0; margin: 0; font: 700 30px/1.05 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.icon-btn {
  flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0;
  background: var(--surface); color: var(--ink); font-size: 22px; display: grid; place-items: center;
}
.icon-btn:active { background: var(--surface-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 20px; border-radius: var(--radius);
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 18px; text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; }
label.btn input { display: none; }

/* home */
.hero-note { color: var(--muted); margin: 4px 0 18px; max-width: 46ch; }
.projects { display: grid; gap: 12px; }
.pcard {
  display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center;
  padding: 10px; border-radius: var(--radius); background: var(--surface); border: 0; text-align: left; width: 100%;
}
.pcard:active { background: var(--surface-2); }
.pcard .cover { width: 96px; height: 72px; border-radius: 10px; background: var(--surface-2) center/cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 26px; }
.pcard .t { font: 700 22px/1.1 var(--font-display); }
.pcard .s { color: var(--muted); font-size: 15px; margin-top: 2px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ok); }
.empty {
  padding: 28px 18px; border: 2px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center;
}
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.dock .row { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dock .row.one { grid-template-columns: 1fr; }

/* project */
.fields { display: grid; gap: 8px; margin-bottom: 14px; }
.fields input {
  width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 2px solid transparent;
  background: var(--surface); font-size: 17px;
}
.fields input:focus { border-color: var(--accent); outline: none; }
.fields input.name { font: 700 26px/1.1 var(--font-display); min-height: 54px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.progress { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); margin: 0 2px 10px; font-size: 15px; }
.progress b { color: var(--ink); font: 700 20px var(--font-display); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { position: relative; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--surface-2); aspect-ratio: 4 / 3; max-width: 100%; }
.tile img, .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile img { object-fit: cover; }
.tile .badge {
  position: absolute; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 999px;
  background: rgba(10,13,17,.78); color: #fff; font-size: 14px; font-weight: 700;
}
.tile .badge.done { background: var(--ok); }
.tile .badge.err { background: var(--danger); }
.tile .no { position: absolute; left: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(10,13,17,.78); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

.plane { margin-bottom: 14px; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.plane h3 { margin: 0; padding: 12px 14px 6px; display: flex; align-items: center; gap: 10px; font: 700 21px var(--font-display); }
.plane h3 .thumb { width: 44px; height: 33px; border-radius: 6px; object-fit: cover; flex: none; }
.rowbtn .no { display: inline-block; min-width: 26px; margin-right: 8px; color: var(--muted); }
.rowbtn .l i { color: var(--muted); }
.plane h3 small { margin-left: auto; color: var(--muted); font: 600 14px var(--font-body); }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.15) inset; }
.rowbtn {
  width: 100%; display: grid; grid-template-columns: 1fr auto 58px; gap: 10px; align-items: center;
  min-height: 52px; padding: 6px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left;
}
.rowbtn:active { background: var(--surface-2); }
.rowbtn .l small { display: block; color: var(--muted); font-size: 14px; }
.rowbtn .v { font: 700 21px var(--font-display); }
.rowbtn .v.miss { color: var(--muted); }
.rowbtn .p { color: var(--muted); font-size: 14px; text-align: right; white-space: nowrap; }

/* sheets & toasts */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; padding: 18px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  display: grid; gap: 10px; max-height: 88vh; overflow: auto;
}
.sheet h2 { margin: 0 0 4px; font: 700 26px var(--font-display); }
.sheet p { margin: 0 0 6px; color: var(--muted); }
.sheet input[type=text], .sheet textarea { min-height: 52px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1.35; }
.sheet textarea { min-height: 150px; resize: vertical; width: 100%; }
.sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--accent); }
/* text sheets open at the top so the iPhone keyboard does not cover them */
.sheet-wrap.top { align-items: flex-start; }
.sheet-wrap.top .sheet { border-radius: 0 0 20px 20px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 18px; }
.opt { display: grid; grid-template-columns: 1fr; text-align: left; justify-items: start; min-height: 64px; padding: 10px 16px; }
.opt small { font-weight: 500; color: var(--muted); font-size: 14px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  max-width: min(92vw, 520px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; text-align: center;
}

/* photo editor */
.ed { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--ed-bg); color: var(--ed-ink); touch-action: none; user-select: none; -webkit-user-select: none; }
.ed-top { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) var(--gutter-r) 8px var(--gutter-l); }
.ed-top .icon-btn { background: var(--ed-key); color: var(--ed-ink); }
.ed-top .ttl { flex: 1; min-width: 0; }
.ed-top .ttl b { display: block; font: 700 22px/1 var(--font-display); }
.ed-top .ttl span { color: var(--ed-muted); font-size: 14px; }
.ed-stage { position: relative; flex: 1; min-height: 120px; }
.ed-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
/* the loupe sits over the bottom panel (below the photo) while a point is being dragged */
.loupe { position: fixed; z-index: 2; border-radius: 50%; border: 4px solid #ffc20e; box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.6); pointer-events: none; }
.ed-panel.dragging > * { visibility: hidden; }
.loupe-slot { display: grid; place-items: center; height: 230px; margin-bottom: 8px; border: 2px dashed var(--ed-key-2); border-radius: 16px; color: var(--ed-muted); font-size: 14px; text-align: center; padding: 0 24px; }
.restore { display: block; margin: 22px 0 0; padding: 12px 0; color: var(--muted); text-align: center; text-decoration: underline; font-size: 15px; cursor: pointer; }
.version { margin: 8px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
.ed-panel { background: var(--ed-panel); padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.ed-panel > * { max-width: 560px; margin-inline: auto; }
.ed-hint { color: var(--ed-muted); text-align: center; font-size: 15px; margin-bottom: 8px; min-height: 20px; }
.ed-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ed .btn { background: var(--ed-key); border-color: var(--ed-key); color: var(--ed-ink); }
.ed .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ed .btn.danger { background: transparent; border-color: #ff5a6e; color: #ff7a8a; }

/* note on the left (up to 3 lines, readable), fraction toggle and delete stacked on the right */
.kb-head { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: stretch; margin-bottom: 8px; }
.kb-side { display: grid; gap: 6px; align-content: start; }
.value-pill {
  position: absolute; left: 10px; bottom: 10px; display: flex; align-items: baseline; gap: 10px;
  padding: 8px 14px; border-radius: 14px; background: rgba(10,13,17,.86); color: #fff; max-width: calc(100% - 20px);
}
.value-pill .typed { font: 700 34px/1 var(--font-display); }
.value-pill .res { color: var(--ed-muted); font-weight: 600; white-space: nowrap; }
.value-pill .res.err { color: #ff7a8a; }
.kb-prec.on { background: var(--accent); color: var(--accent-ink); }
.kb-prec { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--ed-key); color: var(--ed-ink); font-weight: 700; }
.kb-note {
  display: block;
  width: 100%; min-width: 0; min-height: 86px; padding: 8px 12px; border: 0; border-radius: 10px;
  background: var(--ed-key); color: var(--ed-ink); text-align: left; font-size: 16px; line-height: 1.3; font-weight: 600;
}
.kb-note .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.kb-note small { display: block; color: var(--ed-muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
.kb-note.empty { color: var(--ed-muted); font-weight: 500; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr) 6px repeat(2, 1fr); gap: 6px; }
.keys .gap { visibility: hidden; }
.key { min-height: 56px; border: 0; border-radius: 12px; background: var(--ed-key); color: var(--ed-ink); font: 600 26px var(--font-display); }
.key.fr { background: var(--ed-key-2); font-size: 22px; }
.key.fn.on { background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.key.fn { font: 700 16px var(--font-body); }
.key:active, .key.pressed { background: var(--accent); color: var(--accent-ink); }
.kb-foot { display: grid; grid-template-columns: 1.1fr 1fr 1.3fr; gap: 6px; margin-top: 6px; }
.kb-foot .key.back { font-size: 17px; }
.kb-del { color: #ff7a8a; padding: 0 10px; }
.kb-foot .btn { min-height: 56px; padding: 0 8px; }

/* ---------- iPad and other wide screens ---------- */
@media (min-width: 700px) {
  .page { max-width: 1100px; }
  .projects { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .dock .row { max-width: 560px; }
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: 20px; max-width: 520px; padding-bottom: 18px; }
  .loupe-slot { height: 300px; }
}
/* Editor side by side: photo on the left, keypad and loupe in a column on the right.
   Landscape iPad, or any window wide enough to keep the photo large next to the keypad. */
@media (min-width: 900px) and (orientation: landscape), (min-width: 1100px) {
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); }
  .ed-top { grid-column: 1 / -1; }
  .ed-stage { grid-column: 1; grid-row: 2; }
  .ed-panel {
    grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: flex-end; overflow-y: auto;
    border-left: 1px solid var(--ed-key); padding: 14px max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 14px;
  }
  .ed-panel > * { width: 100%; max-width: none; }
  .loupe-slot { flex: 1; height: auto; min-height: 260px; }
  .ed-hint { margin-top: 0; }
  .key { min-height: 62px; }
  .kb-foot .btn, .kb-foot .key { min-height: 62px; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
